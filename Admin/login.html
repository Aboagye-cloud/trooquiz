<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0056d2">
  <title>Admin login | Trooquiz</title>
  <script src="../js/nav.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <main class="page">
  <section class="card login-card">
    <h1>Admin Login</h1>
    <p class="muted">Sign in to manage levels, subjects and questions.</p>

    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="off" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password" required>

      <p id="msg" class="error" hidden></p>
      <button id="login-btn" class="btn" type="submit">Sign in</button>
    </form>
  </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
